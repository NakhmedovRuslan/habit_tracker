[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Ruslan Nakhmedov",email = "ruslan-nahmedov@mail.ru"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=26.2,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-celery-beat-next (>=2.10.0,<3.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "djangorestframework-stubs (>=3.18.2,<4.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "requests (>=2.34.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "coverage (>=7.17.4,<8.0.0)"
]
